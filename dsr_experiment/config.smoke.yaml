# === DATA ===
data:
  asset: "BTC/USDT"
  timeframe: "4h"
  paths:
    raw_ohlcv:      "data/raw/ohlcv.parquet"
    raw_news:       "data/raw/news.parquet"
    train_features: "data/train/features.parquet"
    compressor:     "data/train/compressor.pkl"
    oos_dir:        "data/oos"

# === PERIODS ===
periods:
  train:    { start: "2023-06-01", end: "2023-12-31" }
  oos_2024: { start: "2024-01-01", end: "2024-02-29" }

# === NEWS ===
news:
  hf_dataset: "edaschau/bitcoin_news"
  text_col:   "article_text"
  date_col:   "date_time"
  dedup_threshold: 0.85

# === EMBEDDINGS ===
embeddings:
  model_name: "FinLang/finance-embeddings-investopedia"
  raw_dim: 768
  compressed_dim: 64
  top_pca_lags: 3
  temporal_decay_alpha: 0.1

# === SENTIMENT ===
sentiment:
  model_name: "ProsusAI/finbert"

# === FEATURES ===
features:
  normalize_window: 30
  news_count_lags: [1, 2]
  news_count_roll: 7

# === ENV ===
env:
  window: 30
  tx_cost: 0.001
  reward_type: "dsr"
  allow_short: false
  volatility_penalty: 0.5
  dsr_eta: 0.01
  sentiment_lambda: 0.1

# === EXPERIMENT ===
experiment:
  seeds: [42]
  algos: ["SAC"]
  oos_periods: ["oos_2024"]

# === AGENTS ===
agent_sac:
  device: "cpu"
  total_timesteps: 5000
  learning_rate: 7.3e-4
  lr_schedule: "constant"
  buffer_size: 5000
  batch_size: 256
  learning_starts: 500
  tau: 0.02
  gamma: 0.99
  ent_coef: "auto"
  train_freq: 8
  gradient_steps: 8
  use_sde: true
  net_arch: [128, 128]
  activation_fn: "relu"

agent_ppo:
  device: "cpu"
  total_timesteps: 5000
  learning_rate: 3.0e-4
  lr_schedule: "linear"
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  max_grad_norm: 0.5
  use_sde: true
  net_arch: [128, 128]
  activation_fn: "tanh"
